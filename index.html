<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build- und Stat-Rechner für Attack on Titan Revolution (Roblox): bestes Loadout aus deinen Perks, Upgrades, Trades und Skill-Baum.">
<meta name="theme-color" content="#18181B">
<title>AoTR Build-Rechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Cinzel:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Stahl-Grau wie ODM-Gear. Oben eine schmale App-Leiste, darunter je Bereich ein ruhiges Raster;
   auf dem Handy wandert die Navigation als Tab-Leiste nach unten. Cinzel nur für Namen und Zahlen, die zählen. */
:root{
  --paper:#E4E5E8; --panel:#F6F6F7; --sunk:#ECEDEF; --raise:#FFFFFF;
  --ink:#17181B; --ink2:#5A5D65; --ink3:#878B94; --line:#D2D4D9; --line2:#BFC2C8;
  --accent:#2C2E34; --accent-soft:#DCDDE1; --on-accent:#F6F6F7; --steel:#8D929B;
  --good:#2C7A4C; --good-soft:#D7EBDE; --warn:#9A5B12; --warn-soft:#F2E3CC; --bad:#A3362B; --bad-soft:#F3DAD5;
  --brass:#8A5F14; --brass-soft:#EFE3C9;
  --r-C:#6F766A; --r-R:#2C68A8; --r-E:#7543AD; --r-L:#9F6D0C; --r-M:#BB3527; --r-S:#0B7F7F; --r-D:#A23B86;
  --shadow:0 1px 2px rgba(20,22,26,.06),0 6px 18px rgba(20,22,26,.06);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rad:14px; --rad-s:9px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1012; --panel:#17181B; --sunk:#121315; --raise:#1D1E22;
    --ink:#E8E9EC; --ink2:#A0A3AB; --ink3:#71757E; --line:#27292E; --line2:#34373D;
    --accent:#D6D8DD; --accent-soft:#26282D; --on-accent:#121316; --steel:#646973;
    --good:#6CC08C; --good-soft:#17301F; --warn:#E3A04E; --warn-soft:#33270F; --bad:#F07A6B; --bad-soft:#3A1E1A;
    --brass:#D6A64B; --brass-soft:#33291A;
    --r-C:#9AA195; --r-R:#6BA7E8; --r-E:#B88DEB; --r-L:#E0B04C; --r-M:#F06E5E; --r-S:#3FC7C4; --r-D:#F08AD0;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1012; --panel:#17181B; --sunk:#121315; --raise:#1D1E22;
  --ink:#E8E9EC; --ink2:#A0A3AB; --ink3:#71757E; --line:#27292E; --line2:#34373D;
  --accent:#D6D8DD; --accent-soft:#26282D; --on-accent:#121316; --steel:#646973;
  --good:#6CC08C; --good-soft:#17301F; --warn:#E3A04E; --warn-soft:#33270F; --bad:#F07A6B; --bad-soft:#3A1E1A;
  --brass:#D6A64B; --brass-soft:#33291A;
  --r-C:#9AA195; --r-R:#6BA7E8; --r-E:#B88DEB; --r-L:#E0B04C; --r-M:#F06E5E; --r-S:#3FC7C4; --r-D:#F08AD0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-size:1rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
h3{font-family:var(--f-display);font-size:.92rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
p{margin:0}
a{color:inherit;text-underline-offset:3px}
small,.muted{color:var(--ink2)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- App-Leiste ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.brand svg{width:30px;height:30px;color:var(--ink)}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.05rem;letter-spacing:.08em;line-height:1}
.brand small{display:block;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-top:2px}
.nav{display:flex;gap:2px;margin-left:8px}
.nav a{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.9rem;color:var(--ink2)}
.nav a svg{width:17px;height:17px}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--on-accent);background:var(--accent)}
.tb-act{margin-left:auto;display:flex;gap:6px}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-weight:600;font-size:.85rem;color:var(--ink2)}
.ibtn:hover{color:var(--ink);border-color:var(--line2)}
.ibtn svg{width:17px;height:17px}
.ibtn[aria-expanded="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (max-width:820px){
  .nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:25;justify-content:space-around;background:var(--panel);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav a{flex-direction:column;gap:2px;padding:6px 4px;border-radius:10px;font-size:.68rem;flex:1 1 0;min-width:0}
  .nav a svg{width:21px;height:21px}
  .nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
  main.wrap{padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .ibtn .t{display:none}
}

/* ---------- Grundbausteine ---------- */
main.wrap{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--rad);padding:16px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h small{font-size:.8rem}
.lbl{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line2);background:var(--raise);cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{min-height:30px;padding:0 10px;font-size:.82rem;border-radius:8px}
.lnk{border:0;background:none;padding:0;color:var(--ink);font:inherit;font-size:.84rem;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px;align-self:flex-start}
.lnk:hover{text-decoration-color:var(--ink)}
.x{width:28px;height:28px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--ink3);font-size:1.05rem;line-height:1;flex-shrink:0}
.x:hover{background:var(--sunk);color:var(--ink)}
input[type=number],input[type=search],input[type=text],select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--raise);border:1px solid var(--line2);border-radius:9px;padding:7px 10px;min-height:38px;max-width:100%}
select{padding-right:28px}
textarea{width:100%;min-height:76px;font-family:var(--f-mono);font-size:.78rem;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--sunk);border:1px solid var(--line);border-radius:11px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--ink2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:var(--shadow)}
.seg button.dim{opacity:.55}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);font-size:.76rem;font-weight:600;white-space:nowrap;color:var(--ink2)}
.chip.ok{border-color:var(--good);color:var(--good)}
.chip.miss{border-style:dashed}
.tag{display:inline-flex;align-items:center;font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;white-space:nowrap}
.tag.in{background:var(--good-soft);color:var(--good)}
.tag.eq{border:1px solid var(--line2);background:transparent;color:var(--ink3);cursor:pointer}
.tag.eq[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rar{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--rc)}
.rar::before,.gem{content:"";width:8px;height:8px;background:var(--rc);transform:rotate(45deg);border-radius:1px;display:inline-block;flex-shrink:0}
.tier{font-family:var(--f-mono);font-size:.7rem;font-weight:600;padding:0 5px;border-radius:4px;border:1px solid var(--line2);color:var(--ink2)}
.tier.t-SS{color:var(--ink);border-color:var(--ink)}
.unc{color:var(--warn);font-weight:700;cursor:help}
.stars{color:var(--brass);letter-spacing:1px;font-size:.8rem}
.dot{width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:var(--rc);flex-shrink:0}
.empty{color:var(--ink2);font-size:.9rem;list-style:none}
.help{color:var(--ink2);font-size:.86rem}
.warnline{padding:9px 11px;border-radius:9px;background:var(--bad-soft);font-size:.86rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.note{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border:1px dashed var(--line2);border-radius:var(--rad);font-size:.9rem}
.rowgap{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.kv{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--ink2)}
.kv b{color:var(--ink);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
thead th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
td.num,th.num{text-align:right}
tr.cur td{background:var(--accent-soft)}
.check{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.nextup{padding:9px 12px;border-radius:10px;background:var(--sunk);font-size:.88rem;overflow-wrap:anywhere}

/* ---------- Übersicht ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px);gap:16px;align-items:start}
@media (max-width:1000px){.ov{grid-template-columns:minmax(0,1fr)}}
.hero{display:flex;flex-direction:column;gap:18px;padding:20px}
.hero-main{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero-id{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 260px}
.hname{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,5vw,2.9rem);letter-spacing:.04em;line-height:1}
.hsel{display:flex;flex-wrap:wrap;gap:8px}
.hsel select{min-height:34px;font-size:.86rem;font-weight:600}
.hsub{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.84rem;color:var(--ink2);align-items:center}
.hsub b{color:var(--ink)}
.ring{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0}
.ring svg{width:148px;height:148px}
.r-t{fill:none;stroke:var(--sunk);stroke-width:10}
.r-p{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round}
.r-n{fill:var(--ink);font-family:var(--f-display);font-weight:800}
.r-s{fill:var(--ink3);font-family:var(--f-body);font-size:7.5px;font-weight:700;letter-spacing:.16em}
.ring figcaption{font-size:.78rem;color:var(--ink2)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px 24px}
.bar{display:grid;grid-template-columns:7.2em minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.86rem}
.bar .b-l{color:var(--ink2);font-weight:600}
.bar .b-t{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar .b-t i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.crit .b-t i{background:var(--brass)}
.bar .b-v{font-size:.8rem;color:var(--ink);text-align:right;min-width:4.5em}
.critrow{display:flex;flex-wrap:wrap;gap:6px}
.critrow .chip b{color:var(--ink);font-family:var(--f-mono)}
.critrow .chip.cap{border-color:var(--warn);color:var(--warn)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px}
.slot{display:flex;flex-direction:column;gap:5px;padding:12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--rc,var(--steel)) 7%,var(--raise));min-width:0}
.s-h{display:flex;align-items:center;gap:6px;font-size:.66rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.s-h svg{width:14px;height:14px;color:var(--ink2)}
.s-n{font-weight:700;font-size:1rem;line-height:1.2;overflow-wrap:anywhere}
.s-r{display:flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--rc)}
.s-r b{margin-left:auto;color:var(--ink);font-size:.82rem}
.s-e{font-size:.78rem;color:var(--ink2);line-height:1.3;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.slot.lock{background:transparent;border-style:dashed;color:var(--ink3);justify-content:center}
.slot.lock .s-n{font-weight:600;font-size:.88rem;color:var(--ink2)}
.pips{display:flex;gap:3px}
.s-lv{display:flex;align-items:center;gap:4px}
.s-lv .lvlp{flex:1 1 auto;display:flex;gap:2px}
.s-lv .lvlp button{flex:1 1 0;width:auto;min-width:0;height:12px}
.s-lv .x{width:24px;height:24px;font-size:.95rem;border:1px solid var(--line2);background:var(--raise)}
.s-lv .x:disabled{opacity:.35;cursor:default}
.pips i{flex:1 1 0;height:4px;border-radius:2px;background:var(--line2)}
.pips i.on{background:var(--rc,var(--accent))}
.vs{display:inline-flex;align-items:baseline;gap:6px;padding:3px 10px;border-radius:999px;background:var(--sunk);font-size:.8rem}
.vs b{font-family:var(--f-mono)}
.vs.up b.g{color:var(--good)}
/* Jetzt tun */
.todo-card{padding:16px}
.gl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gi{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.gi:first-child{border-top:0;padding-top:2px}
.gic{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--ink)}
.gic svg{width:18px;height:18px}
.gtx{display:flex;flex-direction:column;gap:3px;min-width:0}
.gv{font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.gtx b{font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.gtx small{font-size:.8rem;line-height:1.35}
.glinks{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:3px}
/* Details */
.detail{padding:0;overflow:hidden}
.acts{padding:12px 12px 4px}
.acts .seg{display:flex;width:100%}
.acts .seg button{flex:1 1 auto}
.alist{list-style:none;margin:0;padding:6px 16px 14px;display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.aitem:last-child{border-bottom:0}
.aitem b{font-weight:600;overflow-wrap:anywhere}
.aitem p{font-size:.84rem;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.gain{font-family:var(--f-mono);font-size:.78rem;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--good-soft);color:var(--good);text-align:center;align-self:start;overflow-wrap:anywhere}
.gain.bad{background:var(--bad-soft);color:var(--bad)}
.gain.neu{background:var(--sunk);color:var(--ink2)}
.asub{list-style:none;font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);padding:14px 0 4px}
.alist>.empty{padding:8px 0}
.xps{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
details.xp{padding:0}
details.xp>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.xp>summary::-webkit-details-marker{display:none}
details.xp>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin-top:-4px;transition:transform .15s}
details.xp[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.xpb{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.statrow{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;padding:5px 0;border-bottom:1px solid var(--line)}
.statrow span:last-child{font-family:var(--f-mono);font-size:.82rem}
.statrow .neg{color:var(--bad)}
.statsrc{font-size:.74rem;color:var(--ink3);padding:2px 0 6px}
.tlinks{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:10px;background:var(--sunk);font-size:.88rem;margin-top:10px}
.tlinks ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.tlwrap{list-style:none}
/* Skill-Leiste */
.hotbar{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.hk{position:relative;min-height:104px;border:1px solid var(--line2);border-radius:12px;background:var(--raise);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:22px 6px 8px;gap:3px;min-width:0}
.hk .key{position:absolute;top:6px;left:8px;font-family:var(--f-display);font-weight:800;font-size:.95rem;color:var(--ink3)}
.hk .cd{position:absolute;top:7px;right:8px;font-family:var(--f-mono);font-size:.66rem;color:var(--ink3)}
.hk b{font-size:.84rem;line-height:1.15;overflow-wrap:anywhere}
.hk small{font-size:.66rem;line-height:1.2}
.hk em{font-style:normal;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);line-height:1.2}

  let s2=step;plan.forEach(it=>{const id=it.t+':'+it.seg+':'+it.i;if(!bought.has(id))planned.set(id,++s2);});
  const cum=new Map();let c=0;plan.forEach(it=>{c+=it.nd.sp;cum.set(it.t+':'+it.seg+':'+it.i,c);});
  return {plan,bought,planned,cum,used,total:plan.reduce((a,it)=>a+it.nd.sp,0),stats,slot,famSlot,cap,famFn:TREES.fam?TREES.fam.fam:'',budget,nodes:bought.size,tap:false,afford:new Set()};
}
function treeAllocTap(){
  const plan=treePlan(),own=new Set(S.tree.own),free=Math.max(0,+S.tree.free||0);
  if(TREES.fam)((S.tree.famOwn||{})[TREES.fam.fam]||[]).forEach(i=>own.add('fam:base:'+i));
  const bought=new Map(),planned=new Map(),stats={},slot={},famSlot={},cap={},cum=new Map(),afford=new Set();let used=0,step=0;
  allNodes().forEach(it=>{const id=it.t+':'+it.seg+':'+it.i;if(!own.has(id))return;used+=it.nd.sp;bought.set(id,++step);if(it.nd.s)for(const k in it.nd.s)stats[k]=(stats[k]||0)+it.nd.s[k];if(it.nd.k==='cap')cap[it.t]=true;if(it.nd.k==='slot'){if(it.t==='fam')famSlot[it.nd.cat]=(famSlot[it.nd.cat]||0)+1;else slot[it.t]=true;}});
  let c=0,s2=0,stop=false;plan.forEach(it=>{const id=it.t+':'+it.seg+':'+it.i;if(bought.has(id))return;c+=it.nd.sp;cum.set(id,c);planned.set(id,++s2);if(!stop&&c<=free)afford.add(id);else stop=true;});
  return {plan,bought,planned,cum,used,total:plan.reduce((a,it)=>a+it.nd.sp,0),stats,slot,famSlot,cap,famFn:TREES.fam?TREES.fam.fam:'',budget:used+free,free,nodes:bought.size,tap:true,afford,rest:c};
}

/* ================= BUILD-SCORE ================= */
function makeCtx(noGear){
  const base={},src=[];
  const add=(k,v,s)=>{if(!v||!isFinite(v))return;if(k==='odmAll'){ODM5.forEach(x=>add(x,v,s));return;}base[k]=(base[k]||0)+v;src.push([k,s,v]);};
  const mems=S.mems.slice(0,memSlots()).filter(m=>m&&MEM[m]);
  mems.forEach(m=>{const M=MEM[m];if(M.s)for(const k in M.s)add(k,M.s[k],'Memory '+m);});
  let shiftsAdd=0;
  S.arts.forEach(a=>{const A=ART[a.a];if(!A)return;for(const k in A.s)add(k,A.s[k],'Artefakt '+A.n);if(A.add)shiftsAdd+=A.add;a.s.forEach(x=>{if(x.k&&+x.v)add(x.k,+x.v,'Substat '+A.n);});});
  S.talents.slice(0,S.prestige).forEach((t,i)=>{const T=TAL[t];if(T)add(T.k,T.v,'Prestige-Talent '+(i+1));});
  for(const k in CUR.tree.stats)add(k,CUR.tree.stats[k],'Skill-Baum');
  if(mems.includes('Quakestrike')&&S.quake>0)add('dmg',1.5*S.quake,'Quakestrike ×'+S.quake);
  return {base,src,mems,shiftsAdd,arch:S.arch};
}
function evalBuild(fn,perks,ctx,detail){
  const f=FAM[fn],a=ctx.arch,t=Object.assign({},ctx.base),src=detail?ctx.src.slice():null;
  const add=(k,v,s)=>{if(!v)return;if(k==='odmAll'){for(const x of ODM5){t[x]=(t[x]||0)+v;if(src)src.push([x,s,v]);}return;}t[k]=(t[k]||0)+v;if(src)src.push([k,s,v]);};
  for(const k in f.s)add(k,f.s[k],'Familie '+f.n);
  let shiftsMax=1,ccMul=1,cdMul=1,ccCap=null,tyr=null,bf=0,taken=1,noSkills=false,pf=false,util=0;
  for(const x of perks){const p=x.p,l=x.l;
    if(!(p.only&&((p.only==='ts')!==(a==='ts'))))for(const k in p.s)add(k,L(p.s[k],l),p.n+' +'+l);
    const s=p.sp;if(s){if(s.shiftsMax)shiftsMax=Math.max(shiftsMax,s.shiftsMax);if(s.ccMul)ccMul*=L(s.ccMul,l);if(s.cdMul)cdMul*=L(s.cdMul,l);if(s.ccCap)ccCap=ccCap==null?L(s.ccCap,l):Math.min(ccCap,L(s.ccCap,l));if(s.tyrant)tyr=[L(s.tyrant[0],l),L(s.tyrant[1],l)];if(s.bf)bf=L(s.bf,l);if(s.taken)taken*=L(s.taken,l);if(s.noSkills)noSkills=true;}
    if(p.n==='Perfect Form')pf=true;
    util+=utv(UT,p.n,a)*(0.7+0.03*l);}
  if(S.raid&&t.dmgRaid)add('dmg',t.dmgRaid,'Raid-Bonus');
  if(S.rage&&f.rage){add('odmAll',15,'Rage Mode');add('hp',125,'Rage Mode');add('regenFlat',3,'Rage Mode');}
  if(f.helos&&S.helos>0){const n=S.helos,s='Undying Hero ×'+n;add('dmg',n,s);add('cd',n,s);add('dr',n,s);add('cc',.6*n,s);}
  util+=utv(FUT,f.n,a);
  const T=k=>t[k]||0;
  let cc=+S.base.cc+T('cc'),cd=+S.base.cd+T('cd'),dmg=T('dmg'),bfAdd=0,tyrAdd=0;
  if(bf){bfAdd=bf*Math.max(0,(+S.base.spd||0)+T('spd'));cd+=bfAdd;}
  cc*=ccMul;cd*=cdMul;
  const ccPreCap=cc;let capCut=0;
  if(ccCap!=null&&cc>ccCap){capCut=cc-ccCap;cc=ccCap;}
  if(tyr){const ta=Math.max(0,cc)*tyr[0]/100,tb=Math.max(0,cd)*tyr[1]/100;tyrAdd=ta+tb;dmg+=tyrAdd;cd-=tb;cc=Math.min(cc,10);}
  const ccRaw=cc,ccE=clamp(cc,0,100),cdE=Math.max(0,cd);
  const gambler=ctx.mems.includes('Gambler')?1.025:1;
  const burn=T('burn');
  const baseCrit=1+S.base.cc/100*S.base.cd/100;
  let scF=1;ctx.mems.forEach(n=>{const M=MEM[n];if(M&&M.sc)scF*=1+ccE/100*M.sc[0]*M.sc[1]*(1+cdE/100);});
  const dmgMul=Math.max(.05,(1+dmg/100)*(1+ccE/100*cdE/100)*gambler*scF*(1+burn/100)*(1+T('swing')/400)/baseCrit);
  const hpTot=Math.max(1,(+S.base.hp+T('hp'))*(1+T('hpPct')/100)),dr=clamp(T('dr'),0,90);
  const ehp=hpTot/((1-dr/100)*taken);
  const surv=(ehp/Math.max(1,+S.base.hp))*Math.pow(1+Math.max(0,T('inj'))/100,.3)*(1+.04*Math.min(T('ignInj'),6))*(1+T('regen')/40+T('regenFlat')/80)*(1+.02*T('bandage'));
  const lp=k=>Math.log(Math.max(.05,1+T(k)/100));
  const lnM=.4*lp('spd')+.25*lp('ctl')+.2*lp('gas')+.15*lp('rng')+.2*Math.log(1+T('gasKill')/20);
  const sh=canSh(f),shifts=sh?shiftsMax+ctx.shiftsAdd:0;
  const lnH=sh?Math.log(Math.max(.05,(1+T('titan')/100)*(1+T('shDmg')/100)))+.3*lp('awk')+.15*Math.log(Math.max(1,shifts)):0;
  const lnC=noSkills?0:-Math.log(1-Math.min(80,Math.max(0,T('cdr')))/100);
  const lnB=Math.log(1+Math.max(0,T('dur')+2*T('cons'))/100);
  const lnE=.5*lp('luck')+.3*lp('gold')+.3*lp('xp');
  const w=PW[a];
  let power=w.D*Math.log(dmgMul)+w.S*Math.log(Math.max(.05,surv))+w.M*lnM+w.H*lnH+w.C*lnC+w.B*lnB+w.E*lnE+util;
  if(noSkills)power-=NSP[a]+((f.rage||f.helos)&&a!=='sup'&&a!=='shift'?.12:0);
  if(a==='shift'&&!sh)power-=3;
  return {power,score:100*Math.exp(power),dmgIdx:100*dmgMul,ehp,hpTot,dr,taken,mob:(T('spd')+T('ctl')+T('gas')+T('rng'))/4,shIdx:100*(1+T('titan')/100)*(1+T('shDmg')/100),shifts,cc:ccE,ccRaw,ccPreCap,capCut,cd:cdE,bfAdd,tyrAdd,gambler,noSkills,pf,t,src,f};
}

/* ================= OPTIMIERER ================= */
function invCands(){const m={};S.inv.forEach(x=>{if(!m[x.n]||m[x.n].l<x.l)m[x.n]={n:x.n,l:x.l,p:PERK[x.n]};});return Object.values(m);}
function countsFor(fn){let sl=slotsOf(fn);const tr=CUR.tree.slot;if(FTREE[fn]&&CUR.tree.famFn===fn){const fs=CUR.tree.famSlot||{},o={};CATS.forEach(c=>{o[c]=Math.min(sl[c]||0,fs[c]||0);});sl=o;}return {core:1+(sl.core||0),off:(tr.off?1:0)+(sl.off||0),def:(tr.def?1:0)+(sl.def||0),sup:(tr.sup?1:0)+(sl.sup||0)};}
function divOK(cd,c,i,full){if(cd.p.r!=='D')return true;if(c==='core')return cd.p.c==='core';if(i!==0)return false;const tr=CUR.tree||{};return full||(!!(tr.slot&&tr.slot[c])&&!!(tr.cap&&tr.cap[c]));}
const fits=(cd,c,i,full)=>(c==='core'||cd.p.c===c)&&divOK(cd,c,i==null?0:i,full);
function selList(sel){const o=[];CATS.forEach(c=>sel[c].forEach(x=>{if(x)o.push(x);}));return o;}
function optimizeFam(fn,cands,ctx,opt){
  opt=opt||{};const counts=opt.counts||countsFor(fn),sel={},used=new Set();
  CATS.forEach(c=>sel[c]=Array(counts[c]).fill(null));
  if(opt.warm)CATS.forEach(c=>(opt.warm[c]||[]).forEach((x,i)=>{if(!x||i>=counts[c])return;const cd=cands.find(y=>y.n===x.n);if(cd&&!used.has(cd.n)&&fits(cd,c,i,opt.full)){sel[c][i]=cd;used.add(cd.n);}}));
  const ev=()=>evalBuild(fn,selList(sel),ctx).power;
  let cur=ev();
  for(;;){let best=null;
    for(const c of CATS){const i=sel[c].indexOf(null);if(i<0)continue;
      for(const cd of cands){if(used.has(cd.n)||!fits(cd,c,i,opt.full))continue;sel[c][i]=cd;const p=ev();sel[c][i]=null;if(p>cur+1e-7&&(!best||p>best.p))best={c,i,cd,p};}}
    if(!best)break;sel[best.c][best.i]=best.cd;used.add(best.cd.n);cur=best.p;}
  const passes=opt.passes==null?3:opt.passes;
  for(let pass=0;pass<passes;pass++){let imp=false;
    for(const c of CATS)for(let i=0;i<sel[c].length;i++){const old=sel[c][i];let bc=old,bp=cur;
      for(const cd of cands){if(cd===old||used.has(cd.n)||!fits(cd,c,i,opt.full))continue;sel[c][i]=cd;const p=ev();if(p>bp+1e-7){bp=p;bc=cd;}}
      if(old){sel[c][i]=null;const p=ev();if(p>bp+1e-7){bp=p;bc=null;}}
      sel[c][i]=bc;if(bc!==old){if(old)used.delete(old.n);if(bc)used.add(bc.n);cur=bp;imp=true;}}
    // Core hält einen Kategorie-Perk: Kategorie-Perk umsetzen, Core neu besetzen
    sel.core.forEach((x,ci)=>{if(!x||x.p.c==='core')return;const c=x.p.c;
      for(let j=0;j<sel[c].length;j++){const occ=sel[c][j];if(!fits(x,c,j,opt.full))continue;
        for(const cd of cands){if(used.has(cd.n)||!fits(cd,'core',ci,opt.full))continue;sel[c][j]=x;sel.core[ci]=cd;const p=ev();
          if(p>cur+1e-7){used.add(cd.n);if(occ)used.delete(occ.n);cur=p;imp=true;return;}
          sel[c][j]=occ;sel.core[ci]=x;}}});
    if(!imp)break;}
  return {fn,sel,power:cur,counts};
}
function tryInsert(fn,sel,cd,ctx,P0){
  let best={gain:-Infinity,rep:null,slot:null};
  CATS.forEach(c=>sel[c].forEach((x,i)=>{if(!fits(cd,c,i))return;const old=sel[c][i];if(old&&old.n===cd.n)return;sel[c][i]=cd;const list=selList(sel).filter((y,k,arr)=>arr.findIndex(z=>z.n===y.n)===k);const p=evalBuild(fn,list,ctx).power;sel[c][i]=old;if(p-P0>best.gain)best={gain:p-P0,rep:old,slot:c};}));
  return best;
}

function solve(){
  CUR.eqFn=(S.famLock&&FAM[S.famLock])?S.famLock:((CUR.sol&&CUR.sol.best&&FAM[CUR.sol.best.fn]&&CUR.sol.best.fn)||S.fams.find(n=>FAM[n])||'Reeves');
  const ctx=makeCtx(),cands=invCands();
  let fams=S.fams.filter(n=>FAM[n]);const noFam=!fams.length;if(noFam)fams=['Reeves'];
  const results=fams.map(fn=>optimizeFam(fn,cands,ctx)).sort((a,b)=>b.power-a.power);
  const best=(S.famLock&&results.find(r=>r.fn===S.famLock))||results[0];
  const m=evalBuild(best.fn,selList(best.sel),ctx,true);
  return {ctx,cands,results,best,m,noFam};
}

function analyze(sol){
  const {ctx,cands,best,m}=sol,fn=best.fn,sel=best.sel,P0=best.power,f=FAM[fn],a=S.arch;
  const inBuild=new Set(selList(sel).map(x=>x.n));
  const withLevel=(name,l)=>selList(sel).map(x=>x.n===name?{n:x.n,l,p:x.p}:x);
  // Upgraden
  const ups=selList(sel).filter(x=>x.l<10).map(x=>{const p10=evalBuild(fn,withLevel(x.n,10),ctx).power,p1=evalBuild(fn,withLevel(x.n,x.l+1),ctx).power;return {x,g10:pct(p10-P0),g1:pct(p1-P0)};}).sort((u,v)=>v.g10-u.g10);
  const promote=[],useless=[];
  cands.filter(c=>!inBuild.has(c.n)).forEach(c=>{
    const r10=tryInsert(fn,sel,{n:c.n,l:10,p:c.p},ctx,P0);
    if(r10.gain>0.004){let need=10;for(let lv=c.l;lv<=10;lv++){if(tryInsert(fn,sel,{n:c.n,l:lv,p:c.p},ctx,P0).gain>0.002){need=lv;break;}}promote.push({c,need,g:pct(r10.gain),rep:r10.rep});}
    else useless.push({c,g10:r10.gain});});
  promote.sort((u,v)=>v.g-u.g);
  // Traden: holen
  const owned=new Set(cands.map(c=>c.n));
  const want=PERKS.filter(p=>!owned.has(p.n)&&p.r!=='D').map(p=>{const r0=tryInsert(fn,sel,{n:p.n,l:0,p},ctx,P0),r10=tryInsert(fn,sel,{n:p.n,l:10,p},ctx,P0);return {p,g0:pct(r0.gain),g10:pct(r10.gain),rep:r10.rep};}).filter(o=>o.g10>1).sort((u,v)=>v.g10-u.g10).slice(0,6);
  const famWant=FAMS.filter(F=>!S.fams.includes(F.n)&&TS[F.t]>=TS.B).map(F=>{const r=optimizeFam(F.n,cands,ctx,{passes:1});return {F,g:pct(r.power-P0)};}).filter(o=>o.g>1).sort((u,v)=>v.g-u.g).slice(0,4);
  // Traden: abgeben
  const why=c=>{const p=c.p;
    if(p.s.cc&&p.s.cc[1]>0&&m.ccRaw>=100)return 'Deine Crit-Chance ist schon bei 100 %, mehr bringt nichts.';
    if(p.g.length===1&&p.g[0]==='shift'&&!canSh(f))return f.sh?`Ohne Titan bringt der Perk nichts. Mit Titan wäre er für ${fn} stark, also nur traden, wenn du nicht auf ein Serum farmst.`:`${fn} kann nicht shiften.`;
    if(p.g.includes('ts')&&p.g.length===1&&a!=='ts')return 'Nur für Thunder-Spear-Builds.';
    if(p.sp&&p.sp.ccMul)return 'Mehr als verdoppelt deine Crit-Chance, halbiert aber den Crit-Schaden. Crit-Chance × Crit-Schaden steigt dadurch nur um gut ein Viertel, dafür fehlt dir ein ganzer Perk. Unterm Strich weniger Schaden.';
    if(p.s.cc&&p.s.cd&&p.s.cd[1]<0)return 'Mehr Crit-Chance, aber weniger Crit-Schaden. Unterm Strich weniger Schaden als ein reiner Schadens-Perk.';
    return 'Schwächer als deine ausgerüsteten Perks, auch auf +10.';};
  const hard=c=>(c.p.s.cc&&c.p.s.cc[1]>0&&m.ccRaw>=100)||(c.p.g.length===1&&c.p.g[0]==='shift'&&!canSh(f));
  const alts=useless.filter(o=>o.g10>-0.05&&!hard(o.c)).map(o=>o.c);
  const giveP=useless.filter(o=>o.g10<=-0.05||hard(o.c)).map(o=>({c:o.c,why:why(o.c),loss:pct(o.g10)})).sort((u,v)=>RORD[v.c.p.r]-RORD[u.c.p.r]);
  const cnt={};S.inv.forEach(x=>{(cnt[x.n]=cnt[x.n]||[]).push(x.l);});
  const dups=Object.entries(cnt).filter(([n,ls])=>ls.length>1).map(([n,ls])=>({n,extra:ls.sort((x,y)=>y-x).slice(1)}));
  const giveF=sol.results.filter(r=>r.fn!==fn&&!sol.noFam).map(r=>{const F=FAM[r.fn];const other=Object.keys(ARCH).filter(k=>k!==a&&ARCH[k].fams.includes(r.fn)).map(k=>ARCH[k].n);return {F,g:pct(r.power-P0),other};});
  // To-do
  const todo=[];
  if(sol.noFam)todo.push({p:'hi',t:'Familien eintragen',b:'Ohne Familie rechnet der Algo mit einer Common-Familie ohne Boni. Trag alle Familien ein, die du besitzt.'});

  const miss=['off','def','sup'].filter(t=>!CUR.tree.slot[t]);
  if(miss.length)todo.push({p:'hi',t:`${miss.map(t=>CAT[t]).join(', ')}-Slot freischalten`,b:`Jeder Skill-Baum hat einen Perk-Slot-Knoten für 5 SP. Im Tab Skill-Baum antippen, was du schon hast; der Plan holt die Slots zuerst.`});
  const n=memSlots();
  if(n){const wantM=idealMems(fn,n),have=S.mems.slice(0,n);const filled=have.filter(Boolean).length;
    if(filled<n)todo.push({p:'hi',t:'Memory-Slots füllen',b:`${n-filled} von ${n} Slots sind leer. Mit Prestige Scrolls rollen; nach 20 Scrolls ist ein 3★+ garantiert. Ziel: ${wantM.filter(x=>!have.includes(x)).slice(0,3).join(', ')}.`});
    const weak=have.filter(x=>x&&!wantM.includes(x)&&memScore(MEM[x],a,f)<TS.A*.85);
    if(weak.length)todo.push({p:'mid',t:'Memories rerollen',b:`${weak.join(', ')} ${weak.length>1?'sind':'ist'} für ${ARCH[a].n} schwach. Ziel: ${wantM.filter(x=>!have.includes(x)).slice(0,3).join(', ')}. Lazurite- und Amethyst-Tickets erhöhen die Chance auf seltene Memories.`});}
  if(S.prestige<5){const nx=PRE[S.prestige+1];if(S.level>=nx.need)todo.push({p:'hi',t:`Prestige ${S.prestige+1} ist möglich`,b:`Vorher die Checkliste im Prestige-Tab durchgehen. Talent-Tipp: ${talentAdvice(fn).n}.`});}
  if(!sol.noFam&&['B','C','D'].includes(f.t))todo.push({p:'mid',t:'Bessere Familie besorgen',b:`${fn} ist Tier ${f.t}. Für ${ARCH[a].n} lohnen sich ${ARCH[a].fams.slice(0,4).join(', ')}. Spins gibt es über Codes, Login und Market.`});
  if(a==='shift'&&!S.titan)todo.push({p:'hi',t:'Kein Titan',b:'Ohne Titan-Serum kannst du nicht shiften. Wähl oben einen anderen Spielstil (ODM-Klingen passt fast immer) oder stell „Titan“ auf „Hab einen“, sobald das Serum gedroppt ist.'});
  else if(a==='shift'&&!f.sh)todo.push({p:'hi',t:'Keine Shifter-Familie',b:'Keine deiner Familien kann shiften. Trag eine Shifter-Familie ein oder wähle einen anderen Spielstil.'});
  if(f.sh&&!S.titan&&a!=='shift')todo.push({p:'info',t:'Titan-Serum farmen',b:`Das Serum droppt sehr selten bei Bossen auf Aberrant. Bis dahin zählen von ${fn} nur die Werte; Titan-Stats und Shift-Perks rechnet der Algo mit 0.`});
  if(m.noSkills)todo.push({p:'mid',t:'Heavenly Restriction schaltet deine Skills ab',b:`Das hat der Algo eingerechnet. Ohne Skills fehlen dir ${f.rage?'Rage Mode und deine Familien-Skills':'deine Skills'} und Skill-Memories wie Assassin.`});
  if(m.capCut>0)todo.push({p:'mid',t:'Flame Rhapsody deckelt deine Crit-Chance',b:`${nf1.format(m.capCut)} % Crit-Chance verfallen.`});
  if(m.taken>1)todo.push({p:'info',t:'Adaptation erhöht erst deinen Schaden-Taken',b:'Bis die Immunität steht, nimmst du mehr Schaden. Im Überleben-Wert eingerechnet.'});
  if(false)todo.push({p:'info',t:'',b:'Zusammen verschieben sie das Schadensfenster auf 85–140 %. Lohnt sich als Memory-Ziel.'});
  {const capMiss=['off','def','sup'].filter(t=>!(CUR.tree.cap&&CUR.tree.cap[t]));
   const divIn=selList(sel).filter(x=>x.p.r==='D').length;

function memFit(M,a,f){if(M.leg&&M.y!=='core'&&!(CUR.tree&&CUR.tree.cap&&CUR.tree.cap[M.y]))return 0;let w=0;M.g.forEach(t=>{const v=W[a][t];w=Math.max(w,v==null?.5:v);});if(M.n==='Apotheosis'&&!canSh(f)&&!f.rage&&!f.helos)return 0;if(M.n==='Stormcharged'&&a!=='shift')w*=.5;return w;}

function gearDerive(ctx0,fn){
  const out={};if(!['cc','cd'].some(k=>S.gear[k].w!==''))return out;
  const m=evalBuild(fn,eqPerks(),ctx0,true),t=m.t;
  ['cc','cd'].forEach(k=>{const w=S.gear[k].w;if(w==='')return;let model,g,b100=false;
    if(k==='cc'){const pre=(+S.base.cc)+(t.cc||0),mul=pre>0?m.ccPreCap/pre:1;model=m.ccRaw;g=(m.tyrAdd>0||m.capCut>0)?null:w/(mul||1)-pre;}
    else if(k==='cd'){const pre=(+S.base.cd)+(t.cd||0)+m.bfAdd,mul=pre>0?m.cd/pre:1;model=m.cd;g=m.tyrAdd>0?null:w/(mul||1)-pre;}
    else if(k==='spd'){model=(+S.base.spd)+(t.spd||0);g=w-model;}
    else{model=t[k]||0;g=w-model;if(g>=90){g-=100;b100=true;model+=100;}}
    const eff=g==null?null:(+S.base[k])+g;
    out[k]={model,g:g==null||eff<0?null:Math.round(g*10)/10,eff,bad:eff!=null&&eff<0};});
  return out;
}

  const ks=['cc','cd'].filter(k=>S.gear[k].w!=='');UI.cal=UI.cal||{};if(!ks.length)return;

  const d=gearDerive(makeCtx(true),fn);
  ks.forEach(k=>{const x=d[k],w=+S.gear[k].w;
    if(k==='cc'&&w>=99.95){UI.cal[k]={st:'cap'};return;}
    if(!x||x.g==null||x.bad){UI.cal[k]={st:'bad',model:x?x.model:null};return;}
    S.base[k]=Math.round(x.eff*10)/10;S.gear[k].cal=S.gear[k].g;S.gear[k].w='';UI.cal[k]={st:'ok',v:S.base[k]};});
}

    list+='<li class="tlwrap">'+tradeLinksHtml()+'</li>';
  }else{
    list+=an.todo.map(s=>itemHtml(s.p==='hi'?'wichtig':s.p==='mid'?'bald':'Tipp',s.p==='hi'?'bad':s.p==='mid'?'':'neu',esc(s.t),esc(s.b))).join('')||'<li class="empty">Alles erledigt.</li>';
  }
  const tradeN=an.want.length+(an.famWant.length?1:0)+an.giveP.filter(o=>o.c.p.r!=='C').length+an.famDups.length;
  // Rechenweg
  const groups={};(m.src||[]).forEach(([k,s,v])=>{(groups[k]=groups[k]||[]).push([s,v]);});
  const statHtml=Object.keys(STATS).filter(k=>groups[k]).map(k=>{const tot=groups[k].reduce((x,y)=>x+y[1],0);if(Math.abs(tot)<.001)return '';return `<div class="statrow"><span>${STATS[k].n}</span><span class="${tot<0?'neg':''}">${fmtStat(k,tot)}</span></div><div class="statsrc">${groups[k].map(g=>`${esc(g[0])} ${fmtStat(k,g[1])}`).join(' · ')}</div>`;}).join('');

   <div class="acts"><div class="seg" role="tablist">

  </div>`;
}

function famActs(fn){const F=FAM[fn];return (FSK[fn]||[]).filter(k=>!k.p&&(!k.t||canSh(F)));}
function famPass(fn){return (FSK[fn]||[]).filter(k=>k.p);}
function barFor(fn){
  const x=FAMX[fn]&&FAMX[fn][S.arch],F=FAM[fn]||{},rp0=recPaths(fn),rp={},fs=famActs(fn).map(k=>k.n);
  ['sup','off','def'].forEach(t=>{rp[t]=pathFixed(t)?S.tree.paths[t]:rp0[t];});
  const offPath=n=>{const l=SKLOC[n];return l&&l.seg!=='base'&&l.seg!==rp[l.t];};
  let b;
  if(x&&x.bar)b=x.bar.slice();
  else{b=fs.slice();ARCH[S.arch].bar.forEach(n=>{if(!b.includes(n))b.push(n);});
    while(b.length>5){let w=-1,wv=1e9;b.forEach((n,i)=>{if(fs.includes(n))return;const v=SKT[n]||2;if(v<=wv){wv=v;w=i;}});if(w<0)break;b.splice(w,1);}}
  b=b.filter(n=>!(NEEDT.has(n)&&!canSh(F)));
  b=b.map(n=>offPath(n)&&OSW[n]?OSW[n]:n);
  b=[...new Set(b)];
  for(const n of ARCH[S.arch].bar.concat(['Black Flare','Bandages','Order: Rage','Red Flare','Counter'])){if(b.length>=5)break;if(!b.includes(n)&&!offPath(n))b.push(n);}
  return b.slice(0,5);
}

function roadmap(){
  const tr=CUR.tree,chunks=[];let cur=null;
  tr.plan.forEach(it=>{const id=it.t+':'+it.seg+':'+it.i,key=it.t+'|'+it.seg;
    if(!cur||cur.key!==key||cur.closed){cur={key,t:it.t,seg:it.seg,items:[],closed:false};chunks.push(cur);}
    cur.items.push({it,id});if(it.nd.k==='slot'&&it.t!=='fam')cur.closed=true;});
  let baseSeen={};
  return chunks.map(c=>{const T=TREES[c.t],ids=c.items.map(x=>x.id),got=ids.filter(id=>tr.bought.has(id)).length;
    const steps=ids.map(id=>tr.tap?tr.planned.get(id):(tr.bought.get(id)||tr.planned.get(id))).filter(x=>x!=null);if(!steps.length)steps.push(0);
    let title;if(c.t==='fam'){title=baseSeen.fam?`${T.fam}-Familienbaum: Rest`:`${T.fam}-Familienbaum`;baseSeen.fam=1;}else if(c.seg==='base'){title=baseSeen[c.t]?`${T.n}: Rest der Basis`:(c.closed?`${T.n}: Basis bis Perk-Slot`:`${T.n}: Basis`);baseSeen[c.t]=1;}
    else{const k=c.t+c.seg,last=c.items[c.items.length-1],full=last.it.i===T[c.seg].nodes.length-1;title=baseSeen[k]?`${T.n}: Rest vom ${T[c.seg].n}-Pfad`:(!full&&last.it.nd.k==='skill'?`${T.n}: ${T[c.seg].n}-Pfad bis ${last.it.nd.n}`:`${T.n}: ${T[c.seg].n}-Pfad`);baseSeen[k]=1;}
    const st={};c.items.forEach(x=>{if(x.it.nd.s)for(const k in x.it.nd.s)st[k]=(st[k]||0)+x.it.nd.s[k];});
    const skills=c.items.filter(x=>x.it.nd.k==='skill').map(x=>x.it.nd.n),slot=c.items.filter(x=>x.it.nd.k==='slot').length,cap=c.items.some(x=>x.it.nd.k==='cap');
    return {title,sp:c.items.reduce((a,x)=>a+x.it.nd.sp,0),cumEnd:tr.cum.get(ids[ids.length-1]),afford:ids.some(id=>tr.afford.has(id)),from:Math.min(...steps),to:Math.max(...steps),done:got===ids.length,part:got>0&&got<ids.length,skills,slot,cap,t:c.t,st};});
}

   case 'quake':S.quake=+t.value;break;
   case 'base':S.base[d.k]=+t.value||0;if(S.gear[d.k])S.gear[d.k].cal=null;break;
   case 'budget':S.tree.budget=Math.max(0,Math.round(+t.value||0));break;
   case 'free':S.tree.free=Math.max(0,Math.round(+t.value||0));break;
   case 'gearG':if(S.gear[d.k])S.gear[d.k].g=clamp(+t.value||0,0,GR.length-1);break;
   case 'gearW':if(S.gear[d.k])S.gear[d.k].w=t.value===''?'':clamp(+t.value||0,-100,5000);break;
   case 'xpNow':S.xpNow=Math.max(0,+t.value||0);break;
   case 'xph':S.xph=Math.max(0,+t.value||0);break;
   default:return;
  }
  touch();renderAll();
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='dbQ'){UI.q=t.value;renderDbList();}else if(t.type==='range'&&t.dataset.out){const o=$(t.dataset.out);if(o)o.textContent=t.value;}});
document.addEventListener('toggle',e=>{const id=e.target.id;if(id==='moreBox')UI.moreOpen=e.target.open;else if(id==='gearBox')UI.gearOpen=e.target.open;else if(id==='slotBox')UI.slotOpen=e.target.open;else if(['xpMeta','xpIdeal','xpCalc'].includes(id))UI[id]=e.target.open;},true);
function applyTheme(c){UI.theme=c;const r=document.documentElement;if(c==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',c);const l=$('themeLbl');if(l)l.textContent={auto:'Auto',light:'Hell',dark:'Dunkel'}[c];}
try{const t=localStorage.getItem('aotr-theme');if(t==='light'||t==='dark')applyTheme(t);}catch(err){}
window.addEventListener('hashchange',()=>{renderAll();try{window.scrollTo(0,0);}catch(err){}});
renderAll();
})();

</script>

</body>
</html>
